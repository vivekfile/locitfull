<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Cards</title>
  <link rel="shortcut icon" href="/assets/logo.png" type="image/x-icon">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f4f4f4;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #222;
    }

    .product-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .card {
      width: 250px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #111;
    }

    .description {
      font-size: 14px;
      color: #666;
      margin-bottom: 12px;
      height: 40px;
      overflow: hidden;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      color: green;
      margin-bottom: 10px;
    }

    .rating {
      color: orange;
      margin-bottom: 12px;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      background: black;
      color: white;
      font-size: 15px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #333;
    }

    .loader {
      text-align: center;
      font-size: 22px;
      margin-top: 50px;
    }
  </style>
</head>

<body>

  <h1>Products</h1>

  <div class="loader" id="loader">
    Loading Products...
  </div>

  <div class="product-container" id="productContainer"></div>


  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/products.js"></script>
  <script src="/js/cart.js"></script>
  <script src="fetch.js"></script>
</body>

</html>
